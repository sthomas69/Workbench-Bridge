name: release

# Build the self-contained single-file Windows exes and publish them as a
# GitHub Release. Fires when a version tag (v*) is pushed; also runnable by hand.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single-file (win-x64)
        shell: pwsh
        run: |
          $out = 'publish/Workbench-Bridge'
          $common = '-c','Release','-r','win-x64','--self-contained','true',
                    '-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true',
                    '-o',$out
          dotnet publish src/WorkbenchBridge.Service/WorkbenchBridge.Service.csproj @common
          dotnet publish src/WorkbenchBridge.Cli/WorkbenchBridge.Cli.csproj @common
          # Never ship a machine-specific local override (it's gitignored, so it
          # won't exist on CI anyway — this is belt-and-braces). The .example
          # template and public appsettings.json DO ship.
          Remove-Item "$out/appsettings.Local.json" -ErrorAction SilentlyContinue

      - name: Zip the release folder
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if (-not $tag -or $tag -eq '') { $tag = 'dev' }
          Compress-Archive -Path publish/Workbench-Bridge/* `
            -DestinationPath "Workbench-Bridge-$tag-win-x64.zip" -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: Workbench-Bridge-*-win-x64.zip
          generate_release_notes: true

      - name: Upload artifact (for manual / non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: Workbench-Bridge-win-x64
          path: Workbench-Bridge-*-win-x64.zip
